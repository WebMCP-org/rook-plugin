name: Release

# Rook's monorepo pushes each release here as a commit and its v<version> tag.
# This workflow builds that tag, publishes it to npm by trusted publishing
# (which adds npm provenance), attests the artifacts and cuts the GitHub
# release. A rerun skips whatever already shipped.
on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.11.0"
          # No dependency cache: a release builds from the lockfile alone.
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify
        run: bash .github/scripts/verify.sh

      - name: Pack
        id: pack
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(jq -er .version package.json)"
          test "$TAG" = "v$version" || { echo "Tag $TAG does not match version $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir dist
          # bin/rook is self-contained, so the published manifest drops the build
          # setup and the source exports Rook's monorepo imports.
          npm pkg delete devDependencies scripts exports
          npm pack --ignore-scripts --pack-destination dist
          cp bin/rook dist/rook
          (cd dist && sha256sum "mcp-b-rook-$version.tgz" rook > SHA256SUMS)
          cat dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm and GitHub
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@mcp-b/rook/v/${{ needs.build.outputs.version }}
    permissions:
      attestations: write
      artifact-metadata: write
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download the release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist

      - name: Check the artifacts against their checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      # Node 24.11.0 bundles npm 11.6.1; trusted publishing needs 11.5.1 or later.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.11.0"
          package-manager-cache: false

      - name: Publish to npm by trusted publishing
        run: |
          if test -n "$(npm view "@mcp-b/rook@$VERSION" version 2>/dev/null)"; then
            echo "::notice::@mcp-b/rook@$VERSION is already on npm."
          else
            # ./ so npm reads a file, not a GitHub repository dist/<name>.
            npm publish "./dist/mcp-b-rook-$VERSION.tgz"
          fi
          echo "- npm: <https://www.npmjs.com/package/@mcp-b/rook/v/$VERSION>" >> "$GITHUB_STEP_SUMMARY"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release v$VERSION already exists."
          else
            gh release create "v$VERSION" -R "$GITHUB_REPOSITORY" --verify-tag \
              --title "rook $VERSION" \
              --notes "\`npm install -g @mcp-b/rook@$VERSION\`. Verify the assets with \`sha256sum -c SHA256SUMS\` and \`gh attestation verify <file> -R $GITHUB_REPOSITORY\`." \
              "dist/mcp-b-rook-$VERSION.tgz" dist/rook dist/SHA256SUMS
          fi
          echo "- Release: <https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION>" >> "$GITHUB_STEP_SUMMARY"
